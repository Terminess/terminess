# Xcode project for signed, notarised releases (scripts/notarise.sh).
# Day-to-day builds still use SwiftPM. Generate with: xcodegen generate
name: Terminess
options:
  bundleIdPrefix: com.nsokin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  Terminal:
    path: .
targets:
  Terminess:
    type: application
    platform: macOS
    sources:
      - path: Sources/TermApp
    dependencies:
      - package: Terminal
        product: TermCore
      - package: Terminal
        product: TermPTY
      - package: Terminal
        product: TermHost
      - package: Terminal
        product: TermHandoff
      # The session service, shipped next to the app's executable (docs/remote.md).
      - target: terminessd
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nsokin.terminal
        PRODUCT_NAME: Terminess
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
    info:
      path: build/Terminess-Info.plist
      properties:
        CFBundleDisplayName: Terminess
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        # Shell scripts Finder can open here (.command, .sh, .tool). Alternate rank:
        # Terminess only becomes the default when the person chooses it
        # (Terminess menu, Make Terminess the Default Terminal).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Shell Script
            CFBundleTypeRole: Shell
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.terminal.shell-script
              - public.shell-script
              - public.unix-executable
        NSLocalNetworkUsageDescription: Terminess listens on your network briefly while you pair your iPhone.
        # Without these, macOS refuses protected folders silently instead of asking.
        NSDesktopFolderUsageDescription: Shells and agents in Terminess read and write files on your Desktop when you ask them to.
        NSDocumentsFolderUsageDescription: Shells and agents in Terminess read and write files in Documents when you ask them to.
        NSDownloadsFolderUsageDescription: Shells and agents in Terminess read files in Downloads, such as screenshots you drop in.
        NSRemovableVolumesUsageDescription: Shells and agents in Terminess read and write files on external drives when you ask them to.
        NSNetworkVolumesUsageDescription: Shells and agents in Terminess read and write files on network drives when you ask them to.
    postBuildScripts:
      - name: Embed terminessd
        script: |
          dest="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/terminessd"
          cp "$BUILT_PRODUCTS_DIR/terminessd" "$dest"
          if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ] && [ "$EXPANDED_CODE_SIGN_IDENTITY" != "-" ]; then
            codesign --force --options runtime --timestamp --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$dest"
          fi
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/terminessd
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/terminessd
      - name: Embed pair
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/bin"
          install -m 755 "$SRCROOT/scripts/pair" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/bin/pair"
        inputFiles:
          - $(SRCROOT)/scripts/pair
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/bin/pair
      - name: Copy icon
        script: cp "$SRCROOT/assets/AppIcon.icns" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/AppIcon.icns"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AppIcon.icns
  terminessd:
    type: tool
    platform: macOS
    sources:
      - path: Sources/terminessd
    dependencies:
      - package: Terminal
        product: TermHost
      - package: Terminal
        product: TermHostServer
      - package: Terminal
        product: TermHandoff
    settings:
      base:
        PRODUCT_NAME: terminessd
        PRODUCT_BUNDLE_IDENTIFIER: com.nsokin.terminal.terminessd
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
